<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 8 Describing Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one compact column sized for an LMS iframe; topic switch, tab bar, shared controls, game stage */
:root{
  --paper:#F2F5FA; --card:#FFFFFF; --ink:#1B2246; --muted:#5A6386; --line:#D7DDEB;
  --indigo:#2D47A0; --indigo-soft:#E4E9F8; --persimmon:#DE5F28; --persimmon-soft:#FBE8DE; --teal:#1E8C8A; --teal-soft:#DDF2F1;
  --good:#257A4E; --goodbg:#DDF1E5; --bad:#C2303B; --badbg:#FBE3E5;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --latin:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111529; --card:#1B2140; --ink:#E8EBF7; --muted:#A2A9C9; --line:#2D3558;
  --indigo:#8099F2; --indigo-soft:#252E58; --persimmon:#F38652; --persimmon-soft:#3D2519; --teal:#4CC3BF; --teal-soft:#15393A;
  --good:#6BCF96; --goodbg:#173A29; --bad:#F27C85; --badbg:#3E1D25; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111529; --card:#1B2140; --ink:#E8EBF7; --muted:#A2A9C9; --line:#2D3558;
  --indigo:#8099F2; --indigo-soft:#252E58; --persimmon:#F38652; --persimmon-soft:#3D2519; --teal:#4CC3BF; --teal-soft:#15393A;
  --good:#6BCF96; --goodbg:#173A29; --bad:#F27C85; --badbg:#3E1D25; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--latin);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:16px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}

ruby{ruby-position:over}
.rmj{font-family:var(--latin);font-weight:600;font-size:.85em;margin-right:.2em}
rt{font-family:var(--latin);font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:.02em}
.no-romaji rt{visibility:hidden}
.jp{font-family:var(--jp);font-weight:700}

/* Topic switch */
.topics{display:flex;gap:8px;flex-wrap:wrap}
.topic{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:6px 14px 6px 6px;font:600 14px var(--latin);cursor:pointer}
.topic .mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--indigo-soft);color:var(--indigo);font:900 18px var(--jp)}
.topic[aria-pressed="true"]{border-color:var(--persimmon)}
.topic[aria-pressed="true"] .mini{background:var(--persimmon);color:#fff}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:48px;height:48px;border-radius:12px;background:var(--persimmon);color:#fff;display:grid;place-items:center;
  font-family:var(--jp);font-weight:900;font-size:30px;line-height:1;flex:none}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:13px}
.ask{font-size:20px;color:var(--indigo)}

.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tab{flex:1 1 auto;border:0;background:transparent;color:var(--muted);font:600 14px var(--latin);padding:9px 12px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--indigo);color:#fff}
.tab:not([aria-selected="true"]):hover{background:var(--indigo-soft);color:var(--ink)}

.controls{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select{font:500 14px var(--latin);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--indigo);width:16px;height:16px}
.btn{font:600 14px var(--latin);border:0;border-radius:9px;padding:8px 14px;cursor:pointer;background:var(--persimmon);color:#fff}
.spacer{flex:1}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:320px}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}

/* Faces */
.w-kanji{font-family:var(--jp);font-weight:700;font-size:clamp(22px,5.4vw,38px);line-height:1.2}
.w-hira,.w-jp{font-family:var(--jp);font-weight:700;font-size:clamp(14px,3.4vw,26px);line-height:1.3;white-space:nowrap}
.w-num{font-weight:700;font-size:clamp(28px,6vw,44px);color:var(--indigo);font-variant-numeric:tabular-nums}
.pic{width:100%;max-width:100%;height:auto;display:block}
.p1{fill:var(--indigo)}.p2{fill:var(--persimmon)}.p3{fill:var(--teal)}
.w-en{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;line-height:1.2}
.w-en .em{font-size:clamp(22px,4.6vw,34px);line-height:1}
.w-en .t{font-weight:600;font-size:clamp(12px,2.4vw,15px)}
.chip{display:inline-block;font:600 10px var(--latin);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:99px;margin-top:4px}
.chip.my{background:var(--persimmon-soft);color:var(--persimmon)}
.chip.pol{background:var(--teal-soft);color:var(--teal)}
.chip.noun{background:var(--indigo-soft);color:var(--indigo)}.stack{display:flex;flex-direction:column;align-items:center}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:8px}
.mcard{aspect-ratio:var(--ratio,4/5);border:0;padding:0;background:none;cursor:pointer;perspective:700px;max-width:100%;font:inherit;color:inherit}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.up .in,.mcard.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;overflow:hidden}
.back{background:var(--indigo);color:rgba(255,255,255,.28);font-family:var(--jp);font-weight:900;font-size:clamp(26px,6vw,46px)}
.front{transform:rotateY(180deg);background:var(--paper);border:2px solid var(--line);color:var(--ink)}
.mcard.done .front{border-color:var(--good);background:var(--goodbg)}
.mcard.wrong .front{border-color:var(--bad)}

/* Match up */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;min-height:70px;padding:6px 10px;
  display:grid;place-items:center;cursor:pointer;font:inherit}
.tile .pic{max-width:150px;max-height:52px;width:auto}
.tile .w-kanji{font-size:30px}.tile .w-hira,.tile .w-jp{font-size:22px}.tile .w-num{font-size:32px}
.tile .w-en{flex-direction:row;gap:8px}.tile .w-en .em{font-size:24px}.tile .w-en .t{font-size:15px}
.tile:hover{border-color:var(--indigo)}
.tile.sel{border-color:var(--indigo);background:var(--indigo-soft)}
.tile.done{border-color:var(--good);background:var(--goodbg);cursor:default}
.tile.shake{animation:shake .35s;border-color:var(--bad);background:var(--badbg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Quiz */
.q{display:flex;flex-direction:column;align-items:center;gap:16px}
.q .prompt{font-size:14px;color:var(--muted)}
.q .show{width:min(340px,100%);padding:18px 24px;background:var(--paper);border-radius:14px;display:grid;place-items:center}
.q .show .w-jp{font-size:40px}
.q .show .w-en .em{font-size:48px}.q .show .w-en .t{font-size:20px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.opt{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px;min-height:74px;cursor:pointer;font:inherit;display:grid;place-items:center}
.opt .w-kanji{font-size:30px}.opt .w-hira,.opt .w-jp{font-size:24px}
.opt .w-en{flex-direction:row;gap:8px}.opt .w-en .em{font-size:22px}.opt .w-en .t{font-size:15px}
.opt:hover:not(:disabled){border-color:var(--indigo)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}

.win{text-align:center;padding:14px;border-radius:12px;background:var(--goodbg);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.win strong{font-size:18px}

/* Word list */
h2{font-size:15px;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td .pic{max-width:120px;max-height:40px;width:auto}
td .w-kanji{font-size:26px}td .w-hira,td .w-jp{font-size:21px}
td.n{font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums}
td.em{font-size:22px;width:40px}
.notes{margin:14px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.notes b{color:var(--ink)}

/* Past tense + reasons */
.w-jp.sm{font-size:clamp(13px,3vw,22px)}
.mem .w-jp.sm{font-size:clamp(11px,2.9vw,19px)}
.tile .w-jp.sm{font-size:19px}
.opt .w-jp.sm{font-size:clamp(15px,3.8vw,22px)}
.q .show .w-jp.sm{font-size:clamp(22px,6vw,32px)}
.hint{font:500 14px var(--latin);color:var(--muted);margin-top:4px}
.rule{background:var(--indigo-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px;line-height:2.1}
.rule .jp{font-size:17px}
.builder{display:flex;flex-direction:column;gap:14px}
.eng{font-size:17px;font-weight:600;text-align:center;text-wrap:balance}
.slot{min-height:80px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.slot.bad{border-color:var(--bad);animation:shake .35s}
.slot .ph{color:var(--muted);font-size:13px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chunk{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:2px 10px;font:700 20px var(--jp);cursor:pointer}
.chunk:hover{border-color:var(--indigo)}
.slot .chunk{background:var(--card);border-color:var(--indigo)}
.chunk.used{visibility:hidden}
.row{display:flex;gap:10px;justify-content:center}
.btn.ghost{background:var(--indigo-soft);color:var(--indigo)}
.fb{text-align:center;min-height:1.6em;font-size:15px}
.fb .jp{font-size:19px}

@media (max-width:480px){
  .tile .w-jp.sm{font-size:14px}
  .chunk{font-size:17px}
  .mem{grid-template-columns:repeat(var(--cols-sm,5),minmax(0,1fr))}
  .cols{gap:10px}
  .tile .w-kanji{font-size:24px}.tile .w-hira,.tile .w-jp{font-size:17px}
  .tile .w-en,.opt .w-en{flex-direction:column;gap:2px}.tile .w-en .t{font-size:13px}
  h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.mcard .in{transition:none}.tile.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app">

  <header>
    <div class="brand">
      <div class="seal" id="seal" aria-hidden="true">人</div>
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
    </div>
    <div class="ask jp" id="ask"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-memory" aria-selected="true" data-tab="memory">Memory</button>
    <button class="tab" role="tab" id="tab-match" aria-selected="false" data-tab="match">Match up</button>
    <button class="tab" role="tab" id="tab-quiz" aria-selected="false" data-tab="quiz">Quiz</button>
    <button class="tab" role="tab" id="tab-past" aria-selected="false" data-tab="past">Past tense</button>
    <button class="tab" role="tab" id="tab-reasons" aria-selected="false" data-tab="reasons">Reasons から</button>
    <button class="tab" role="tab" id="tab-list" aria-selected="false" data-tab="list">Word list</button>
  </div>

  <div class="controls">
    <span id="fields" style="display:contents"></span>
    <label class="toggle"><input type="checkbox" id="romaji" checked> Show romaji</label>
    <span class="spacer"></span>
    <button class="btn" id="newGame">New game</button>
  </div>

  <section class="stage" id="stage" aria-live="polite"></section>
</div>

<script>
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rb=(t,r)=>`<ruby>${t}<rt>${r}</rt></ruby>`;
const val=id=>{const el=document.getElementById(id);return el?el.value:null};

/* =================== Year 8: describing words =================== */
/* type: i = い-adjective, na = な-adjective, n = noun (seasons and weather) */
const A=[
  {id:'omoshiroi', jp:'おもしろい', r:'omoshiroi', en:'interesting',     em:'🤔', type:'i'},
  {id:'tanoshii',  jp:'たのしい',   r:'tanoshii',  en:'fun / enjoyable', em:'🎉', type:'i'},
  {id:'tsumaranai',jp:'つまらない', r:'tsumaranai',en:'boring',          em:'🥱', type:'i'},
  {id:'oishii',    jp:'おいしい',   r:'oishii',    en:'delicious',       em:'😋', type:'i'},
  {id:'yasashii',  jp:'やさしい',   r:'yasashii',  en:'easy / kind',     em:'😊', type:'i'},
  {id:'muzukashii',jp:'むずかしい', r:'muzukashii',en:'difficult',       em:'🧩', type:'i'},
  {id:'ookii',     jp:'大きい', kana:'おおきい', r:'ookii',   en:'big',   em:'🐘', type:'i'},
  {id:'chiisai',   jp:'小さい', kana:'ちいさい', r:'chiisai', en:'small', em:'🐭', type:'i'},
  {id:'nagai',     jp:'ながい',     r:'nagai',     en:'long',            em:'🐍', type:'i'},
  {id:'mijikai',   jp:'みじかい',   r:'mijikai',   en:'short',           em:'✏️', type:'i'},
  {id:'atsui',     jp:'あつい',     r:'atsui',     en:'hot',             em:'🥵', type:'i'},
  {id:'samui',     jp:'さむい',     r:'samui',     en:'cold',            em:'🥶', type:'i'},

  {id:'shizuka',   jp:'しずか（な）', r:'shizuka (na)', en:'quiet',            em:'🤫', type:'na'},
  {id:'yuumei',    jp:'ゆうめい（な）', r:'yuumei (na)', en:'famous',          em:'⭐', type:'na'},
  {id:'nigiyaka',  jp:'にぎやか（な）', r:'nigiyaka (na)', en:'bustling / lively', em:'🏙️', type:'na'},
  {id:'kirei',     jp:'きれい（な）', r:'kirei (na)',   en:'pretty',           em:'💐', type:'na'},
  {id:'benri',     jp:'べんり（な）', r:'benri (na)',   en:'convenient',       em:'🏪', type:'na'},
  {id:'hen',       jp:'へん（な）',   r:'hen (na)',     en:'strange',          em:'👽', type:'na'},

  {id:'natsu', jp:'なつ', r:'natsu', en:'summer', em:'🌻', type:'n'},
  {id:'aki',   jp:'あき', r:'aki',   en:'autumn', em:'🍁', type:'n'},
  {id:'fuyu',  jp:'ふゆ', r:'fuyu',  en:'winter', em:'⛄', type:'n'},
  {id:'haru',  jp:'はる', r:'haru',  en:'spring', em:'🌸', type:'n'},
  {id:'ame',   jp:'あめ', r:'ame',   en:'rain',   em:'☔', type:'n'},
  {id:'hare',  jp:'はれ', r:'hare',  en:'sunny',  em:'☀️', type:'n'}
];
const OPP=[['ookii','chiisai'],['nagai','mijikai'],['atsui','samui'],['yasashii','muzukashii'],
  ['tanoshii','tsumaranai'],['shizuka','nigiyaka'],['natsu','fuyu'],['haru','aki'],['hare','ame']];
const aById=id=>A.find(w=>w.id===id);
const typeChip=w=>w.type==='i'?'<span class="chip my">い adjective</span>':w.type==='na'?'<span class="chip pol">な adjective</span>':'<span class="chip noun">noun</span>';
const jpFace=w=>`<span class="w-jp">${rb(w.jp,w.r)}</span>`;
const enFace=w=>`<span class="w-en"><span class="em" aria-hidden="true">${w.em}</span><span class="t">${w.en}</span></span>`;
const aPool=()=>{const v=val('wordSet');return v==='all'?A.slice():v==='adj'?A.filter(w=>w.type!=='n'):A.filter(w=>w.type===v)};

/* Each form is [japanese, romaji] */
function forms(w){
  if(w.type==='i'){
    const sj=w.jp.slice(0,-1), sr=w.r.slice(0,-1);
    return {plain:[w.jp,w.r], plainPast:[sj+'かった',sr+'katta'],
      present:[w.jp+'です',w.r+' desu'], past:[sj+'かったです',sr+'katta desu'],
      wrongPast:[[w.jp+'でした',w.r+' deshita'],[sj+'かったでした',sr+'katta deshita'],[w.jp+'かったです',w.r+'katta desu']],
      wrongPlainPast:[w.jp+'だった',w.r+' datta']};
  }
  const b=w.jp.replace('（な）',''), br=w.r.replace(' (na)','');
  const wp=[[b+'かったです',br+'katta desu'],[b+'だったです',br+' datta desu'],
    w.type==='na'?[b+'なでした',br+' na deshita']:[b+'でしたです',br+' deshita desu']];
  if(w.id==='kirei') wp[0]=['きれかったです','kirekatta desu'];
  return {plain:[b,br], plainPast:[b+'だった',br+' datta'],
    present:[b+'です',br+' desu'], past:[b+'でした',br+' deshita'],
    wrongPast:wp, wrongPlainPast:w.id==='kirei'?['きれかった','kirekatta']:[b+'かった',br+'katta']};
}
const fj=(f,cls='')=>`<span class="w-jp${cls?' '+cls:''}">${rb(f[0],f[1])}</span>`;
const jr=(j,r)=>`<span class="jp">${rb(j,r)}</span>`;

const RULE_PAST=`<div class="rule"><b>い adjectives:</b> drop い, add かったです · ${jr('あつい','atsui')} → ${jr('あつかったです','atsukatta desu')}<br>
  <b>な adjectives and nouns:</b> add でした · ${jr('しずか','shizuka')} → ${jr('しずかでした','shizuka deshita')}</div>`;
const RULE_REASON=`<div class="rule"><b>Reason first, then から.</b><br>
  い adjectives + から: ${jr('あついから','atsui kara')} · な adjectives and nouns + だから: ${jr('べんりだから','benri da kara')}, ${jr('あめだから','ame da kara')}<br>
  Past: ${jr('あつかったから','atsukatta kara')} · ${jr('べんりだったから','benri datta kara')}</div>`;

/* Reason sentences. First five are the worksheet. v = [present, romaji, past, romaji] */
const TABE=['たべます。','tabemasu.','たべました。','tabemashita.'], SURU=['します。','shimasu.','しました。','shimashita.'], IKU=['いきます。','ikimasu.','いきました。','ikimashita.'];
const RS=[
  {adj:'atsui', em:'🍦', en:'Because it is hot, I eat ice-cream.', enP:'Because it was hot, I ate ice-cream.', obj:[['を','o','aisukuriimu']], v:TABE},
  {adj:'ame',   em:'📺', en:'Because it is rainy, I watch TV.', enP:'Because it was rainy, I watched TV.', obj:[['を','o','terebi']], v:['みます。','mimasu.','みました。','mimashita.']},
  {adj:'samui', em:'🧣', en:'I wear a scarf because it is cold.', enP:'I wore a scarf because it was cold.', obj:[['を','o','mafuraa']], v:SURU},
  {adj:'oishii',em:'🍣', en:'I eat sushi because it is delicious.', enP:'I ate sushi because it was delicious.', obj:[['すしを','sushi o']], v:TABE},
  {adj:'benri', em:'🚌', en:'Because it is convenient, I go by bus.', enP:'Because it was convenient, I went by bus.', obj:[['で','de','basu']], v:IKU},
  {adj:'tanoshii',  em:'🎮', en:'I play games because it is fun.', enP:'I played games because it was fun.', obj:[['を','o','geemu']], v:SURU},
  {adj:'muzukashii',em:'📚', en:'Because it is difficult, I study a lot.', enP:'Because it was difficult, I studied a lot.', obj:[['たくさん','takusan']], v:['べんきょうします。','benkyou shimasu.','べんきょうしました。','benkyou shimashita.']},
  {adj:'hare',      em:'🌳', en:'Because it is sunny, I go to the park.', enP:'Because it was sunny, I went to the park.', obj:[['こうえんに','kouen ni']], v:IKU},
  {adj:'kirei',     em:'📷', en:'I take photos because it is pretty.', enP:'I took photos because it was pretty.', obj:[['しゃしんを','shashin o']], v:['とります。','torimasu.','とりました。','torimashita.']},
  {adj:'tsumaranai',em:'😴', en:'Because it is boring, I sleep.', enP:'Because it was boring, I slept.', obj:[], v:['ねます。','nemasu.','ねました。','nemashita.']},
  {adj:'shizuka',   em:'📖', en:'Because it is quiet, I read a book.', enP:'Because it was quiet, I read a book.', obj:[['ほんを','hon o']], v:['よみます。','yomimasu.','よみました。','yomimashita.']},
  {adj:'nigiyaka',  em:'🏮', en:'I go to the festival because it is lively.', enP:'I went to the festival because it was lively.', obj:[['おまつりに','omatsuri ni']], v:IKU}
];

function pastQuestions(){
  const p=aPool(), qs=[]; let last=null;
  while(qs.length<10){const it=p[Math.floor(Math.random()*p.length)]; if(it!==last||p.length===1){qs.push(it);last=it}}
  return qs.map(w=>{const f=forms(w);return {
    prompt:'Choose the past tense.',
    show:`<span class="stack">${fj(f.present,'sm')}<span class="hint">${w.em} ${w.en}</span></span>`,
    opts:shuffle([{html:fj(f.past,'sm'),ok:true},...f.wrongPast.map(x=>({html:fj(x,'sm'),ok:false}))])};});
}

const describe={
  seal:'い', title:'Describing words', sub:'Year 8 Japanese · adjectives, seasons and weather', quizTab:'What does it mean?',
  ask:`${rb('なつ','natsu')}${rb('は','wa')}${rb('あつい','atsui')}${rb('です','desu')}。`,
  fields:[
    {id:'pairType',label:'Match',opts:[['jp-en','Japanese ↔ English'],['opp','Opposites'],['past','Present ↔ Past']],
     show:tab=>tab==='memory'||tab==='match'},
    {id:'wordSet',label:'Words',opts:[['i','い adjectives'],['na','な adjectives'],['adj','All adjectives'],['n','Seasons & weather'],['all','Everything']],
     show:tab=>tab==='quiz'||tab==='past'||((tab==='memory'||tab==='match')&&val('pairType')!=='opp')},
    {id:'tense',label:'Tense',opts:[['present','Present (is)'],['past','Past (was)']],show:tab=>tab==='reasons'},
    {id:'sentSet',label:'Sentences',opts:[['ws','Worksheet 1–5'],['all','All 12']],show:tab=>tab==='reasons'}
  ],
  memory:{max:6, ratio:'5/4'},
  pairs(){
    if(val('pairType')==='opp') return OPP.map(([a,b])=>({key:a,a:jpFace(aById(a)),b:jpFace(aById(b))}));
    if(val('pairType')==='past') return aPool().map(w=>{const f=forms(w);return {key:w.id,a:fj(f.present,'sm'),b:fj(f.past,'sm')}});
    return aPool().map(w=>({key:w.id,a:jpFace(w),b:enFace(w)}));
  },
  questions(){
    const p=aPool(), qs=[]; let last=null;
    while(qs.length<10){const it=p[Math.floor(Math.random()*p.length)]; if(it!==last){qs.push(it);last=it}}
    return qs.map((it,i)=>{
      const en=i%2===0, f=w=>en?jpFace(w):enFace(w);
      return {prompt:en?'Choose the Japanese word.':'What does this mean?', show:en?enFace(it):jpFace(it),
        opts:shuffle([{html:f(it),ok:true},...shuffle(p.filter(w=>w!==it)).slice(0,3).map(o=>({html:f(o),ok:false}))])};
    });
  },
  list(){
    const table=type=>`<div class="tbl"><table><thead><tr><th></th><th>English</th><th>Japanese</th><th>Reading</th></tr></thead><tbody>
      ${A.filter(w=>w.type===type).map(w=>`<tr><td class="em" aria-hidden="true">${w.em}</td><td>${w.en}</td><td>${jpFace(w)}</td><td>${w.kana?`<span class="w-jp">${rb(w.kana,w.r)}</span>`:''}</td></tr>`).join('')}
    </tbody></table></div>`;
    return `
    <h2><span class="chip my" style="margin:0">い adjective</span> Adjectives ending in い</h2>${table('i')}
    <h2><span class="chip pol" style="margin:0">な adjective</span> Adjectives that take な</h2>${table('na')}
    <h2><span class="chip noun" style="margin:0">noun</span> Seasons and weather</h2>${table('n')}
    <ul class="notes">
      <li><b>い adjectives</b> go straight before a noun: <span class="jp">${rb('おもしろい','omoshiroi')} ${rb('ほん','hon')}</span> (an interesting book).</li>
      <li><b>な adjectives</b> add な before a noun: <span class="jp">${rb('しずかな','shizuka na')} ${rb('まち','machi')}</span> (a quiet town).</li>
      <li>At the end of a sentence, drop the な: <span class="jp">${rb('まち','machi')}${rb('は','wa')}${rb('しずか','shizuka')}${rb('です','desu')}。</span></li>
      <li><b>Watch out:</b> <span class="jp">${rb('きれい','kirei')}</span> ends in い but it is a な adjective.</li>
      <li><b>Past tense, い adjectives:</b> drop い, add かったです. <span class="jp">${rb('あつい','atsui')} → ${rb('あつかったです','atsukatta desu')}</span></li>
      <li><b>Past tense, な adjectives and nouns:</b> add でした. <span class="jp">${rb('しずか','shizuka')} → ${rb('しずかでした','shizuka deshita')}</span>, <span class="jp">${rb('あめ','ame')} → ${rb('あめでした','ame deshita')}</span></li>
      <li><b>Giving reasons:</b> the reason comes first, then から. い adjectives + から: <span class="jp">${rb('さむいから','samui kara')}</span>. な adjectives and nouns + だから: <span class="jp">${rb('べんりだから','benri da kara')}</span>.</li>
    </ul>`;
  }
};

/* =================== Shared game engine =================== */
const TOPICS={describe};
let topicKey='describe', tab='memory';
const T=()=>TOPICS[topicKey];
const stage=$('#stage');
const winMsg=extra=>`<div class="win"><strong class="jp">${rb('よくできました','yoku dekimashita')}！</strong><span>${extra}</span><button class="btn" data-again>Play again</button></div>`;
stage.addEventListener('click',e=>{if(e.target.closest('[data-again]'))render()});

function memory(){
  const cfg=T().memory;
  let ps=shuffle(T().pairs()); if(cfg.max) ps=ps.slice(0,cfg.max);
  const cards=shuffle(ps.flatMap(p=>[{key:p.key,side:'a',html:p.a},{key:p.key,side:'b',html:p.b}]));
  const n=cards.length, cols=n%4===0&&n%5!==0?4:5, colsSm=n===12?3:cols;
  let open=[], lock=false, moves=0, found=0;
  stage.innerHTML=`<div class="status"><span>Flip two cards. Find the pairs.</span><span>Moves <b id="mv">0</b> · Pairs <b id="pf">0</b>/${ps.length}</span></div>
    <div class="mem" id="mem" style="--cols:${cols};--cols-sm:${colsSm};--ratio:${cfg.ratio}"></div><div id="end"></div>`;
  const grid=$('#mem');
  cards.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='mcard'; b.id='m'+i; b.setAttribute('aria-label','Hidden card');
    b.innerHTML=`<div class="in"><div class="face back">${T().seal}</div><div class="face front">${c.html}</div></div>`;
    b.onclick=()=>{
      if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
      b.classList.add('up'); b.removeAttribute('aria-label');
      open.push([b,c]);
      if(open.length<2)return;
      moves++; $('#mv').textContent=moves;
      const [[b1,c1],[b2,c2]]=open; open=[];
      if(c1.key===c2.key&&c1.side!==c2.side){
        b1.classList.add('done');b2.classList.add('done');found++;$('#pf').textContent=found;
        if(found===ps.length) $('#end').innerHTML=winMsg(`All ${ps.length} pairs in ${moves} moves.`);
      }else{
        lock=true;b1.classList.add('wrong');b2.classList.add('wrong');
        setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up','wrong');x.setAttribute('aria-label','Hidden card')});lock=false},1000);
      }
    };
    grid.appendChild(b);
  });
}

function matchup(){
  let queue=shuffle(T().pairs()), mistakes=0, round=0;
  const rounds=Math.ceil(queue.length/5);
  function next(){
    const set=queue.splice(0,5); round++;
    let sel=null, done=0;
    stage.innerHTML=`<div class="status"><span>Tap a card on the left, then its match on the right.</span><span>Round <b>${round}</b>/${rounds} · Mistakes <b id="mk">${mistakes}</b></span></div>
      <div class="cols"><div class="col" id="L"></div><div class="col" id="R"></div></div><div id="end"></div>`;
    const mk=(p,side,i)=>{
      const el=document.createElement('button');
      el.className='tile';el.id=side+i;el.dataset.k=p.key;el.dataset.side=side;el.innerHTML=side==='L'?p.a:p.b;
      el.onclick=()=>{
        if(el.classList.contains('done'))return;
        if(!sel||sel.dataset.side===side){ if(sel)sel.classList.remove('sel'); sel=el; el.classList.add('sel'); return; }
        if(sel.dataset.k===el.dataset.k){
          sel.classList.remove('sel');sel.classList.add('done');el.classList.add('done');sel=null;done++;
          if(done===set.length){
            if(queue.length){
              $('#end').innerHTML=`<div class="win"><strong>Round ${round} done!</strong><button class="btn" id="nx">Next round</button></div>`;
              $('#nx').onclick=next;
            }else $('#end').innerHTML=winMsg(`Finished with ${mistakes} mistake${mistakes===1?'':'s'}.`);
          }
        }else{
          mistakes++;$('#mk').textContent=mistakes;
          const s=sel; s.classList.remove('sel'); sel=null;
          [s,el].forEach(x=>{x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');setTimeout(()=>x.classList.remove('shake'),400)});
        }
      };
      return el;
    };
    shuffle(set).forEach((p,i)=>$('#L').appendChild(mk(p,'L',i)));
    shuffle(set).forEach((p,i)=>$('#R').appendChild(mk(p,'R',i)));
  }
  next();
}

function quiz(){runQuiz(T().questions())}
function runQuiz(qs,rule=''){
  let i=0, score=0;
  function show(){
    if(i===qs.length){
      stage.innerHTML=score>=8?winMsg(`${score} / ${qs.length} correct.`)
        :`<div class="win"><strong>${score} / ${qs.length}</strong><span>Keep practising. Look at the Word list tab, then play again.</span><button class="btn" data-again>Play again</button></div>`;
      return;
    }
    const q=qs[i];
    stage.innerHTML=`${rule}<div class="status"><span>Question <b>${i+1}</b>/${qs.length}</span><span>Score <b>${score}</b></span></div>
      <div class="q"><span class="prompt">${q.prompt}</span><div class="show">${q.show}</div><div class="opts" id="opts"></div></div>`;
    q.opts.forEach((o,j)=>{
      const b=document.createElement('button');b.className='opt';b.id='o'+j;b.innerHTML=o.html;
      b.onclick=()=>{
        const all=document.querySelectorAll('.opt'); all.forEach(x=>x.disabled=true);
        if(o.ok){b.classList.add('right');score++}
        else{b.classList.add('no');all[q.opts.findIndex(x=>x.ok)].classList.add('right')}
        setTimeout(()=>{i++;show()},o.ok?900:1800);
      };
      $('#opts').appendChild(b);
    });
  }
  show();
}

/* Sentence builder: tap word chunks in order. One distractor tile tests the から / だから or past form. */
/* A chunk can start with a romaji word (no katakana), e.g. basu + で */
const chunkHTML=t=>(t.pre?`<span class="rmj">${t.pre}</span>`:'')+rb(t.j,t.r);
function reasons(){
  const past=val('tense')==='past';
  const qs=val('sentSet')==='ws'?RS.slice(0,5):shuffle(RS);
  let i=0, score=0;
  function show(){
    if(i===qs.length){
      stage.innerHTML=RULE_REASON+(score>=Math.ceil(qs.length*.8)?winMsg(`${score} / ${qs.length} right first time.`)
        :`<div class="win"><strong>${score} / ${qs.length} right first time</strong><span>Read the rule above, then try again.</span><button class="btn" data-again>Play again</button></div>`);
      return;
    }
    const s=qs[i], w=aById(s.adj), f=forms(w);
    const adj=past?f.plainPast:f.plain;
    const conn=(!past&&w.type!=='i')?['だから、','da kara,']:['から、','kara,'];
    const verb=past?[s.v[2],s.v[3]]:[s.v[0],s.v[1]];
    const ans=[adj,conn,...s.obj,verb].map((c,k)=>({j:c[0],r:c[1],pre:c[2],id:'a'+k}));
    const dis=past?f.wrongPlainPast:(w.type==='i'?['だから、','da kara,']:['から、','kara,']);
    const tiles=shuffle([...ans,{j:dis[0],r:dis[1],id:'x'}]);
    let placed=[], tries=0, solved=false;
    stage.innerHTML=`${RULE_REASON}<div class="status"><span>Sentence <b>${i+1}</b>/${qs.length}</span><span>Right first time <b>${score}</b></span></div>
      <div class="builder">
        <div class="eng"><span aria-hidden="true">${s.em}</span> ${past?s.enP:s.en}</div>
        <div class="slot" id="slot" aria-label="Your sentence"></div>
        <div class="bank" id="bank"></div>
        <div class="row"><button class="btn ghost" id="clr">Clear</button><button class="btn" id="chk">Check</button></div>
        <div class="fb" id="fb" aria-live="polite"></div>
      </div>`;
    const slot=$('#slot'), bank=$('#bank');
    const tileEl=(t,pre)=>{const b=document.createElement('button');b.className='chunk';b.id=pre+t.id;b.innerHTML=chunkHTML(t);return b};
    function draw(){
      slot.classList.remove('bad'); slot.innerHTML='';
      if(!placed.length){slot.innerHTML='<span class="ph">Tap the words below in order</span>';return}
      placed.forEach((t,k)=>{const b=tileEl(t,'p-');b.onclick=()=>{if(solved)return;placed.splice(k,1);$('#c-'+t.id).classList.remove('used');draw()};slot.appendChild(b)});
    }
    tiles.forEach(t=>{const b=tileEl(t,'c-');b.onclick=()=>{if(solved||b.classList.contains('used'))return;b.classList.add('used');placed.push(t);draw()};bank.appendChild(b)});
    draw();
    $('#clr').onclick=()=>{if(solved)return;placed=[];bank.querySelectorAll('.chunk').forEach(c=>c.classList.remove('used'));draw();$('#fb').innerHTML=''};
    $('#chk').onclick=()=>{
      if(solved){i++;show();return}
      const ok=placed.length===ans.length&&placed.every((t,k)=>t.id===ans[k].id);
      if(ok){
        solved=true; if(!tries)score++;
        slot.classList.add('ok'); $('#fb').innerHTML=`<span class="jp">${rb('せいかい','seikai')}！</span> Correct!`;
        $('#chk').textContent=i+1<qs.length?'Next sentence':'Finish'; $('#clr').hidden=true;
      }else{
        tries++; slot.classList.remove('bad'); void slot.offsetWidth; slot.classList.add('bad');
        $('#fb').innerHTML=tries>=2?`Answer: <span class="jp">${ans.map(chunkHTML).join(' ')}</span>`
          :past?'Not quite. Check the word order and the past form of the adjective.':'Not quite. Check the word order and whether you need から or だから.';
      }
    };
  }
  show();
}

const GAMES={memory,match:matchup,quiz,past:()=>runQuiz(pastQuestions(),RULE_PAST),reasons,list:()=>{stage.innerHTML=T().list()}};

function buildTopic(){
  const t=T();
  $('#seal').textContent=t.seal; $('#title').textContent=t.title; $('#sub').textContent=t.sub;
  $('#ask').innerHTML=t.ask; $('#tab-quiz').textContent=t.quizTab;
  
  $('#fields').innerHTML=t.fields.map(f=>`<label class="field" id="f-${f.id}">${f.label}
    <select id="${f.id}">${f.opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>`).join('');
  t.fields.forEach(f=>document.getElementById(f.id).onchange=render);
  document.querySelectorAll('.topic').forEach(b=>b.setAttribute('aria-pressed',b.dataset.topic===topicKey));
}
function render(){
  T().fields.forEach(f=>document.getElementById('f-'+f.id).hidden=!f.show(tab));
  $('#newGame').hidden=(tab==='list');
  GAMES[tab]();
}
function setTopic(k){
  topicKey='describe';
  buildTopic(); render();
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  tab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  render();
});
document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{
  if(location.hash!=='#'+b.dataset.topic) location.hash=b.dataset.topic; else setTopic(b.dataset.topic);
});
window.addEventListener('hashchange',()=>setTopic(location.hash.slice(1)));
$('#newGame').onclick=render;
$('#romaji').onchange=e=>document.body.classList.toggle('no-romaji',!e.target.checked);
setTopic(location.hash.slice(1));
</script>
